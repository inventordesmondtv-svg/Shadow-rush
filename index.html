<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#100827">
<meta name="description" content="Shadow Rush — an anime-inspired mobile sword fighting game.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Shadow Rush</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09051a;color:#fff;font-family:system-ui,Arial;touch-action:none}
#wrap{height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 20%,#30205e,#09051a 65%)}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;gap:10px}
.logo{font-weight:1000;letter-spacing:1px;font-size:20px;color:#d9b5ff;text-shadow:0 0 14px #a855f7}
.stats{font-size:12px;text-align:right;color:#e8d9ff}
#game{display:block;width:100%;flex:1;min-height:0}
#hud{position:absolute;left:12px;top:58px;font-size:12px;pointer-events:none;text-shadow:0 2px 4px #000}
.bar{width:132px;height:9px;background:#342744;border:1px solid #a78bfa;border-radius:8px;overflow:hidden;margin:4px 0 8px}
.fill{height:100%;background:linear-gradient(90deg,#fb3b77,#ff9dba);width:100%}
#bottom{display:flex;justify-content:space-between;align-items:end;padding:8px 18px 18px;gap:12px}
#stick{width:112px;height:112px;border:2px solid #a78bfa88;border-radius:50%;background:#ffffff12;position:relative;touch-action:none}
#knob{position:absolute;width:44px;height:44px;left:32px;top:32px;border-radius:50%;background:#c4b5fd99;border:2px solid #fff}
.actions{display:flex;gap:12px;align-items:end}
.action{width:68px;height:68px;border-radius:50%;border:2px solid #f0abfc;background:linear-gradient(145deg,#7e22ce,#32105e);color:white;font-weight:900;font-size:12px;box-shadow:0 0 18px #a855f766;touch-action:none}
.action:active{transform:scale(.94);background:#c026d3}
#overlay{position:absolute;inset:0;background:#080316dd;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.panel{max-width:360px;background:linear-gradient(160deg,#241044,#100827);border:1px solid #a78bfa;border-radius:22px;padding:24px;box-shadow:0 0 45px #7e22ce66}
h1{margin:0;color:#e9d5ff;font-size:34px;text-shadow:0 0 18px #a855f7}
p{color:#d8c9ec;line-height:1.45}
#start{border:0;border-radius:14px;padding:14px 28px;background:linear-gradient(90deg,#facc15,#f97316);font-weight:1000;font-size:18px;color:#241044}
.small{font-size:11px;color:#bba9d5}
#toast{position:absolute;top:42%;left:0;right:0;text-align:center;font-weight:900;font-size:22px;color:#fde68a;text-shadow:0 2px 8px #000;pointer-events:none}
</style>
</head>
<body>
<div id="wrap">
<header><div class="logo">⚔ SHADOW RUSH</div><div class="stats"><span id="level">LEVEL 1</span> · <span id="score">0</span> SOULS</div></header>
<canvas id="game"></canvas>
<div id="hud">HP <div class="bar"><div class="fill" id="hp"></div></div><span id="wave">WAVE 1</span></div>
<div id="toast"></div>
<div id="bottom">
<div id="stick"><div id="knob"></div></div>
<div class="actions"><button class="action" id="dash">DASH</button><button class="action" id="attack">SLASH</button></div>
</div>
</div>
<div id="overlay"><div class="panel"><h1>SHADOW<br>RUSH</h1><p>Fight through shadow monsters, survive each wave and become stronger.</p><p>Move with the left joystick. Tap <b>SLASH</b> to attack and <b>DASH</b> to dodge.</p><button id="start">START GAME</button><p class="small">Offline play · Made for mobile</p></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W=0,H=0,player,enemies=[],particles=[],score=0,wave=1,hp=100,playing=false,last=0,attack=0,dash=0,invuln=0,spawnTimer=0;
const stick=document.getElementById('stick'),knob=document.getElementById('knob');
let joy={x:0,y:0},joyId=null;
function resize(){const r=canvas.getBoundingClientRect();W=canvas.width=Math.floor(r.width*devicePixelRatio);H=canvas.height=Math.floor(r.height*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=r.width;H=r.height;if(player){player.x=Math.min(W-25,Math.max(25,player.x));player.y=Math.min(H-25,Math.max(25,player.y));}}
addEventListener('resize',resize);resize();
function reset(){player={x:W/2,y:H*.55,r:15,speed:210,face:0};enemies=[];particles=[];score=0;wave=1;hp=100;attack=0;dash=0;invuln=0;spawnTimer=0;updateHud();}
function updateHud(){document.getElementById('hp').style.width=hp+'%';document.getElementById('score').textContent=score;document.getElementById('level').textContent='LEVEL '+(1+Math.floor(score/80));document.getElementById('wave').textContent='WAVE '+wave;}
function spawn(){let a=Math.random()*Math.PI*2,d=Math.max(W,H)*.58;enemies.push({x:W/2+Math.cos(a)*d,y:H*.52+Math.sin(a)*d,r:13+Math.random()*4,hp:2+Math.floor(wave/3),speed:45+Math.random()*25+wave*3,hit:0});}
function burst(x,y,color,n=8){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=40+Math.random()*150;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.4+Math.random()*.4,color});}}
function slash(){if(!playing||attack>0)return;attack=.28;let hit=0;for(const e of enemies){let dx=e.x-player.x,dy=e.y-player.y,dist=Math.hypot(dx,dy),ang=Math.atan2(dy,dx);let diff=Math.atan2(Math.sin(ang-player.face),Math.cos(ang-player.face));if(dist<78&&Math.abs(diff)<1.25){e.hp--;e.hit=.15;burst(e.x,e.y,'#e879f9',5);hit++;}}if(hit)score+=hit*5;updateHud();}
function doDash(){if(!playing||dash>0)return;dash=.25;invuln=.38;player.x+=Math.cos(player.face)*58;player.y+=Math.sin(player.face)*58;player.x=Math.max(18,Math.min(W-18,player.x));player.y=Math.max(18,Math.min(H-18,player.y));burst(player.x,player.y,'#a78bfa',10);}
function frame(t){let dt=Math.min(.032,(t-last)/1000||0);last=t;if(playing)update(dt);draw();requestAnimationFrame(frame);}
function update(dt){attack=Math.max(0,attack-dt);dash=Math.max(0,dash-dt);invuln=Math.max(0,invuln-dt);spawnTimer-=dt;
let mag=Math.hypot(joy.x,joy.y);if(mag>.08){let x=joy.x/mag,y=joy.y/mag;player.x+=x*player.speed*dt;player.y+=y*player.speed*dt;player.face=Math.atan2(y,x);}
player.x=Math.max(18,Math.min(W-18,player.x));player.y=Math.max(18,Math.min(H-18,player.y));
if(spawnTimer<=0&&enemies.length<Math.min(4+wave,12)){spawn();spawnTimer=1.1;}
for(const e of enemies){let dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt;e.hit=Math.max(0,e.hit-dt);if(d<e.r+player.r&&invuln<=0){hp-=18*dt;if(hp<=0){hp=0;gameOver();}}}
enemies=enemies.filter(e=>{if(e.hp<=0){score+=10;burst(e.x,e.y,'#c084fc',14);return false;}return true;});
for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt;p.vx*=.96;p.vy*=.96;}particles=particles.filter(p=>p.t>0);
let next=1+Math.floor(score/80);if(next>wave){wave=next;hp=Math.min(100,hp+20);toast('WAVE '+wave+'!');}updateHud();}
let toastTimer;function toast(s){let el=document.getElementById('toast');el.textContent=s;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.textContent='',900);}
function gameOver(){playing=false;document.querySelector('#overlay .panel').innerHTML=`<h1>YOU FELL</h1><p>You collected <b>${score}</b> souls and reached wave <b>${wave}</b>.</p><button id="start">TRY AGAIN</button>`;document.getElementById('overlay').style.display='flex';document.getElementById('start').onclick=startGame;}
function startGame(){reset();playing=true;document.getElementById('overlay').style.display='none';}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#100a25';ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#30204e';ctx.lineWidth=1;for(let x=0;x<W;x+=42){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}for(let y=0;y<H;y+=42){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
ctx.fillStyle='#24133c';for(let i=0;i<18;i++){let x=(i*97+31)%W,y=(i*137+70)%H;ctx.beginPath();ctx.arc(x,y,2,0,7);ctx.fill();}
for(const e of enemies){ctx.save();ctx.translate(e.x,e.y);ctx.fillStyle=e.hit?'#fff':'#6d28d9';ctx.shadowColor='#c026d3';ctx.shadowBlur=18;ctx.beginPath();ctx.arc(0,0,e.r,0,7);ctx.fill();ctx.fillStyle='#f0abfc';ctx.fillRect(-7,-3,4,3);ctx.fillRect(4,-3,4,3);ctx.restore();}
for(const p of particles){ctx.globalAlpha=Math.max(0,p.t*1.8);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill();ctx.globalAlpha=1;}
if(player){ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.face);ctx.shadowColor='#a78bfa';ctx.shadowBlur=18;ctx.fillStyle=invuln>0?'#fff':'#c4b5fd';ctx.beginPath();ctx.arc(0,0,player.r,0,7);ctx.fill();ctx.fillStyle='#17102b';ctx.fillRect(-6,-5,4,3);ctx.fillRect(3,-5,4,3);ctx.strokeStyle='#f5d0fe';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(5,4);ctx.lineTo(29,4);ctx.stroke();if(attack>0){ctx.strokeStyle='#f0abfc';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,0,56,-1.1,1.1);ctx.stroke();}ctx.restore();}}
document.getElementById('start').onclick=startGame;document.getElementById('attack').addEventListener('pointerdown',e=>{e.preventDefault();slash();});document.getElementById('dash').addEventListener('pointerdown',e=>{e.preventDefault();doDash();});
stick.addEventListener('pointerdown',e=>{joyId=e.pointerId;stick.setPointerCapture(joyId);moveJoy(e);});stick.addEventListener('pointermove',e=>{if(e.pointerId===joyId)moveJoy(e);});function moveJoy(e){let r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy),m=Math.min(36,d);joy.x=d?dx/d*m/36:0;joy.y=d?dy/d*m/36:0;knob.style.transform=`translate(${joy.x*36}px,${joy.y*36}px)`;}function releaseJoy(e){if(e.pointerId===joyId){joyId=null;joy={x:0,y:0};knob.style.transform='';}}stick.addEventListener('pointerup',releaseJoy);stick.addEventListener('pointercancel',releaseJoy);
document.addEventListener('contextmenu',e=>e.preventDefault());requestAnimationFrame(frame);
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
